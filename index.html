<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://cdn.jsdelivr.net; img-src 'self'; style-src 'self'; script-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'">
  <title>rederive</title>
  <meta name="description" content="Paste a GitHub repo. Find out whether its committed data can actually be re-derived from the scripts it ships.">
  <link rel="stylesheet" href="./css/site.css">
</head>
<body>
  <main>
    <h1>rederive</h1>
    <p class="tagline">can this repo's data actually be re-derived from its own scripts? paste it, find out.</p>

    <form id="grade-form">
      <input id="repo-input" type="text" placeholder="owner/repo or github.com URL" autocomplete="off" spellcheck="false" autofocus>
      <button id="grade-btn" type="submit">grade</button>
    </form>
    <div class="chips">
      <span class="try">try:</span>
      <button type="button" class="chip" data-repo="CSSEGISandData/COVID-19">CSSEGISandData/COVID-19</button>
      <button type="button" class="chip" data-repo="owid/covid-19-data">owid/covid-19-data</button>
      <button type="button" class="chip" data-repo="laynr/FedRAMP">laynr/FedRAMP</button>
      <button type="button" class="chip" data-repo="laynr/rederive-demo">laynr/rederive-demo</button>
    </div>
    <p class="spec-link">grades: <strong>F</strong> data with no recipe · <strong>C</strong> recipe with moving inputs · <strong>B</strong> pinned inputs, verified here · <strong>A</strong> re-derived in your browser, byte-for-byte — <a href="./spec.html">the rederive.json spec</a></p>

    <ol id="progress" hidden></ol>
    <div id="report" hidden></div>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
