<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No network egress: repo transform code runs here with default-src 'none'.
       Loaded with sandbox="allow-scripts" (no allow-same-origin) → opaque origin. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' blob:">
  <title>rederive sandbox</title>
</head>
<body>
<script type="module">
// Refuse to run outside the sandboxed iframe: opened top-level (or framed
// without the sandbox attribute) this page is NOT an opaque origin — it would
// share laynr.github.io storage. Opaque origin serializes as the string "null".
if (window.origin !== 'null' || window.parent === window) throw new Error('rederive sandbox: refusing to run outside a sandboxed iframe');
const EXPECTED_PARENT_ORIGIN = new URL(location.href).origin;
window.addEventListener('message', async (event) => {
  const msg = event.data;
  if (!msg || msg.type !== 'run') return;
  if (event.origin !== EXPECTED_PARENT_ORIGIN) return;
  const reply = (payload, transfers) => event.source.postMessage({ nonce: msg.nonce, ...payload }, '*', transfers ?? []);
  try {
    // Build blob URLs deepest-first, rewriting relative import specifiers.
    const sources = new Map(Object.entries(msg.moduleSources));
    const blobUrls = new Map();
    const resolveRel = (from, spec) => {
      const parts = from.split('/').slice(0, -1);
      for (const seg of spec.split('/')) {
        if (seg === '.' || seg === '') continue;
        else if (seg === '..') parts.pop();
        else parts.push(seg);
      }
      return parts.join('/');
    };
    const build = (path, stack) => {
      if (blobUrls.has(path)) return blobUrls.get(path);
      if (stack.includes(path)) throw new Error('circular import: ' + stack.concat(path).join(' -> '));
      let text = sources.get(path);
      if (text == null) throw new Error('missing module: ' + path);
      const importRe = /((?:^|\n)\s*(?:import|export)[^'"]*from\s*|import\s*\(\s*)(["'])([^"']+)\2/g;
      text = text.replace(importRe, (full, head, quote, spec) => {
        const target = resolveRel(path, spec);
        return head + quote + build(target, stack.concat(path)) + quote;
      });
      const url = URL.createObjectURL(new Blob([text], { type: 'text/javascript' }));
      blobUrls.set(path, url);
      return url;
    };
    const entryUrl = build(msg.entryModule, []);

    const encodeOutputs = (result) => {
      if (!result || typeof result !== 'object') throw new Error('transform must return an object of {outputPath: bytes|string}');
      const outputs = {};
      const transfers = [];
      for (const [path, value] of Object.entries(result)) {
        const bytes = typeof value === 'string' ? new TextEncoder().encode(value)
          : value instanceof Uint8Array ? value
          : value instanceof ArrayBuffer ? new Uint8Array(value)
          : null;
        if (!bytes) throw new Error('output ' + path + ' is neither bytes nor string');
        const copy = bytes.slice().buffer;
        outputs[path] = copy;
        transfers.push(copy);
      }
      return { outputs, transfers };
    };

    const runInline = async () => {
      const mod = await import(entryUrl);
      const entry = mod[msg.entryName];
      if (typeof entry !== 'function') throw new Error('entry export "' + msg.entryName + '" is not a function');
      const inputs = {};
      for (const [name, buf] of Object.entries(msg.inputs)) inputs[name] = new Uint8Array(buf);
      return encodeOutputs(await entry(inputs));
    };

    // Preferred: a disposable module Worker — terminable mid-run (hard CPU
    // boundary) and without DOM/navigation APIs. Falls back to running on the
    // iframe's own thread if Worker creation is unavailable here.
    const runInWorker = () => new Promise((resolve, reject) => {
      const workerCode = 'self.onmessage = async (e) => {\n'
        + '  const { entryUrl, entryName, inputs } = e.data;\n'
        + '  try {\n'
        + '    const mod = await import(entryUrl);\n'
        + '    const entry = mod[entryName];\n'
        + '    if (typeof entry !== "function") throw new Error("entry export \\"" + entryName + "\\" is not a function");\n'
        + '    const inp = {};\n'
        + '    for (const [k, b] of Object.entries(inputs)) inp[k] = new Uint8Array(b);\n'
        + '    self.postMessage({ ok: true, result: await entry(inp) });\n'
        + '  } catch (err) { self.postMessage({ ok: false, message: String(err && err.message || err) }); }\n'
        + '};\n';
      const worker = new Worker(URL.createObjectURL(new Blob([workerCode], { type: 'text/javascript' })), { type: 'module' });
      const timeoutMs = Math.min(Number(msg.timeoutMs) || 30000, 60000);
      const timer = setTimeout(() => {
        worker.terminate();
        reject(new Error('transform timed out after ' + timeoutMs + ' ms (worker terminated)'));
      }, timeoutMs);
      worker.onerror = (e) => { clearTimeout(timer); worker.terminate(); reject(new Error(e.message || 'worker error')); };
      worker.onmessage = (e) => {
        clearTimeout(timer);
        worker.terminate();
        try {
          if (!e.data.ok) throw new Error(e.data.message);
          resolve(encodeOutputs(e.data.result));
        } catch (err) { reject(err); }
      };
      // Transfer copies so msg.inputs stays intact for the inline fallback.
      const inputCopies = {};
      const transfers = [];
      for (const [k, b] of Object.entries(msg.inputs)) {
        const copy = b.slice(0);
        inputCopies[k] = copy;
        transfers.push(copy);
      }
      worker.postMessage({ entryUrl, entryName: msg.entryName, inputs: inputCopies }, transfers);
    });

    let ran;
    try {
      ran = await runInWorker();
    } catch (error) {
      if (/worker|Worker/.test(String(error)) && !/timed out|is not a function/.test(String(error))) {
        ran = await runInline();
      } else {
        throw error;
      }
    }
    reply({ type: 'result', outputs: ran.outputs }, ran.transfers);
  } catch (error) {
    reply({ type: 'error', message: String(error && error.message || error) });
  }
});
window.parent.postMessage({ type: 'sandbox-ready' }, '*');
</script>
</body>
</html>
